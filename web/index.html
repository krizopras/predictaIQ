<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PredictaIQ</title><style>body{margin:0;font-family:Arial,sans-serif;background:#0b1020;color:#eef2ff}header{padding:28px 6%;background:#121a30;border-bottom:1px solid #263252}h1{margin:0}main{max-width:1100px;margin:35px auto;padding:0 20px}.card{background:#121a30;border:1px solid #263252;border-radius:16px;padding:24px;margin-bottom:20px}input,button{padding:13px;border-radius:10px;border:1px solid #39476c;background:#0b1020;color:white}input{width:38%;margin-right:8px}button{cursor:pointer;background:#3157d5;border:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.match{padding:18px;background:#0d1427;border-radius:12px}.muted{color:#9aa7c7}.result{margin-top:18px;font-size:18px}</style></head><body><header><h1>PredictaIQ</h1><div class="muted">Futbol verileri ve istatistiksel tahmin paneli</div></header><main><section class="card"><h2>Mac Tahmini</h2><input id="home" placeholder="Ev sahibi"><input id="away" placeholder="Deplasman"><button onclick="predict()">Tahmin Et</button><div id="result" class="result"></div></section><section class="card"><h2>Maclar</h2><div id="matches" class="grid">Yukleniyor...</div></section></main><script>async function load(){const r=await fetch('/api/matches');const d=await r.json();const el=document.getElementById('matches');el.innerHTML=d.length?d.map(m=>`<div class="match"><b>${m.home}</b><br><span class="muted">vs</span><br><b>${m.away}</b><br><small>${m.time||''}</small></div>`).join(''):'Veri kaynagi henuz yuklenmedi.'}async function predict(){const home=document.getElementById('home').value,away=document.getElementById('away').value;const r=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({homeTeam:home,awayTeam:away})});const d=await r.json();document.getElementById('result').textContent=d.prediction||d.error}load()</script></body></html>
